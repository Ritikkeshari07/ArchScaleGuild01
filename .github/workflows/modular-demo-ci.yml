name: Four-app demo checks

on:
  push:
    paths:
      - "modular-demo/**"
      - ".github/workflows/modular-demo-ci.yml"
  pull_request:
    paths:
      - "modular-demo/**"
      - ".github/workflows/modular-demo-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modular-demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run modularity checks
        run: npm test
